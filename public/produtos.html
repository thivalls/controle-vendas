<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos · Controle de Vendas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <aside id="sidebar" class="sidebar">
    <nav id="nav"></nav>
  </aside>

  <div class="main-area">
    <header>
      <button type="button" id="toggle-sidebar" class="toggle-sidebar" aria-expanded="true" aria-controls="sidebar">Ocultar menu</button>
      <h1>Controle de Vendas</h1>
    </header>

    <main>
      <div class="page-header">
        <h2>Produtos</h2>
        <a href="produto-form.html" class="botao">+ Novo Produto</a>
      </div>
      <!-- Movido para dentro da toolbar da tabela (ao lado da busca) via produtos.js assim que a
           tabela é criada — fica aqui fora só para não ser apagado pelo innerHTML do criarTabela. -->
      <div id="filtro-fornecedor-produtos" class="filtro-toolbar">
        <span class="filtro-toolbar-label">Fornecedor</span>
        <div id="busca-fornecedor-filtro-produtos" class="filtro-toolbar-campo"></div>
        <button type="button" id="limpar-filtro-produtos" class="filtro-toolbar-limpar">Limpar</button>
      </div>
      <div id="tabela-produtos"></div>
    </main>
  </div>

</div>

<script src="js/common.js"></script>
<script src="js/data-table.js"></script>
<script src="js/multi-select-busca.js"></script>
<script src="js/produtos.js"></script>
</body>
</html>
