<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-pagina">Novo Lançamento · Controle de Vendas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <aside id="sidebar" class="sidebar">
    <nav id="nav"></nav>
  </aside>

  <div class="main-area">
    <header>
      <button type="button" id="toggle-sidebar" class="toggle-sidebar" aria-expanded="true" aria-controls="sidebar">Ocultar menu</button>
      <h1>Controle de Vendas</h1>
    </header>

    <main>
      <div class="page-header">
        <h2 id="titulo-formulario">Novo Lançamento</h2>
        <a href="caixa.html" class="botao secundario">Voltar</a>
      </div>
      <div class="panel">
        <form id="form-caixa">
          <div class="form-inline">
            <label class="field field-estreita">Tipo
              <select name="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
              </select>
            </label>
            <label class="field">Categoria
              <input type="text" name="categoria" list="categorias-caixa" placeholder="Ex: Aluguel, Transporte">
              <datalist id="categorias-caixa">
                <option value="Compra de mercadoria">
                <option value="Aluguel">
                <option value="Embalagem">
                <option value="Transporte">
                <option value="Outros">
              </datalist>
            </label>
            <label class="field field-estreita">Valor (R$) *
              <input type="number" step="0.01" min="0" name="valor" placeholder="0,00" required>
            </label>
            <label class="field field-larga">Descrição
              <input type="text" name="descricao" placeholder="Ex: Aluguel do mês (opcional)">
            </label>
          </div>
          <p class="dica">Comprou mais mercadoria para revender? Use a categoria <strong>"Compra de mercadoria"</strong> — assim ela não é contada como despesa no Relatório Mensal (o custo do produto só entra no lucro quando ele é vendido).</p>
          <div class="form-acoes">
            <button type="submit">Salvar</button>
            <a href="caixa.html" class="botao secundario">Cancelar</a>
          </div>
        </form>
      </div>
    </main>
  </div>

</div>

<script src="js/common.js"></script>
<script src="js/caixa-form.js"></script>
</body>
</html>
